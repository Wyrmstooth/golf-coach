# fly.toml app configuration file generated for golf-dashboard on 2026-04-16T12:55:16+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'golf-dashboard'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://golf-coach-frontend.onrender.com'
  ENVIRONMENT = 'production'
  MPLBACKEND = 'Agg'
  PYTHONDONTWRITEBYTECODE = '1'
  PYTHONUNBUFFERED = '1'
  SECRET_KEY = 'your-secret-key-here'

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']
    force_https = true

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/api/health'
    protocol = 'http'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048

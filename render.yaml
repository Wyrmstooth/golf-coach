services:
  - type: web
    name: golfcoach-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: MPLBACKEND
        value: Agg
      - key: DATABASE_URL
        fromDatabase:
          name: golfcoach-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://golfcoach-frontend.onrender.com

databases:
  - name: golfcoach-db
    databaseName: golfcoach
    user: golfcoach
    region: oregon
    plan: free


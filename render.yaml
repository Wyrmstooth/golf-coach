services:
  - type: web
    name: golfcoach-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: MPLBACKEND
        value: Agg
      - key: DATABASE_URL
        fromDatabase:
          name: golfcoach-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://golf-coach-frontend.onrender.com

  - type: static_site
    name: golfcoach-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    buildEnvVars:
      - key: VITE_API_URL
        value: https://golf-dashboard-vmqd.onrender.com/api

databases:
  - name: golfcoach-db
    databaseName: golfcoach
    user: golfcoach
    region: oregon
    plan: free

